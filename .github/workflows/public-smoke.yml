name: Public deployment smoke test
on:
  workflow_dispatch:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  public:
    if: github.repository == 'webs1821/gg-retro'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 tests/public_smoke.py --config deploy/site.toml
