name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install tested Rust version
        run: rustup toolchain install 1.99.1 --profile minimal && rustup default 1.99.1
      - run: cargo test --locked --workspace
      - run: cargo build --locked -p gg-server
      - name: TCP and HTTP integration tests
        run: GG_RETRO_BINARY="$PWD/target/debug/gg-retro" python3 tests/wire_integration.py
      - name: Registration, invitation quotas and concurrency
        run: GG_RETRO_BINARY="$PWD/target/debug/gg-retro" python3 tests/registration_integration.py
      - name: Classic image relay, online sender requirement, privacy and limits
        run: GG_RETRO_BINARY="$PWD/target/debug/gg-retro" python3 tests/images_integration.py
      - name: GG6 conferences, offline delivery and per-recipient image grants
        run: GG_RETRO_BINARY="$PWD/target/debug/gg-retro" python3 tests/conferences_integration.py
      - name: Restart, logout and private persistent offline descriptions
        run: GG_RETRO_BINARY="$PWD/target/debug/gg-retro" python3 tests/presence_integration.py
      - name: GG6 public directory, opt-in profiles, ownership, pagination and presence privacy
        run: GG_RETRO_BINARY="$PWD/target/debug/gg-retro" python3 tests/directory_integration.py
      - run: node tests/patcher.test.cjs
      - name: Original installer rebuild and input validation
        run: python3 tests/client_package_test.py
      - name: Configured downloads and startup validation
        run: GG_RETRO_BINARY="$PWD/target/debug/gg-retro" python3 tests/downloads_integration.py
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: sh tests/check-audit-graph.sh
