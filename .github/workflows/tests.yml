name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install tested Rust version
        run: rustup toolchain install 1.99.1 --profile minimal && rustup default 1.99.1
      - run: cargo test --locked --workspace
      - run: cargo build --locked -p gg-server
      - name: TCP and HTTP integration tests
        run: GG_RETRO_BINARY="$PWD/target/debug/gg-retro" python3 tests/wire_integration.py
      - run: node tests/patcher.test.cjs
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: sh tests/check-audit-graph.sh
