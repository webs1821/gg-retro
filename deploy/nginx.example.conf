# Install in the nginx http context (e.g. sites-enabled).
limit_req_zone $binary_remote_addr zone=gg_web:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=gg_registration:1m rate=2r/m;
limit_conn_zone $binary_remote_addr zone=gg_connections:1m;
log_format gg_private '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent';

server {
    listen 80;
    server_name gadu-gadu.k13.pl;
    access_log /var/log/nginx/gg-retro.access.log gg_private;
    error_log /var/log/nginx/gg-retro.error.log warn;
    location ~ ^/appsvc/appmsg[34]\.asp$ {
        limit_except GET { deny all; }
        limit_req zone=gg_web burst=15 nodelay;
        proxy_pass http://10.0.1.7:18074;
        proxy_set_header Host $host;
    }
    # A legacy client must create its account using the HTTPS website.
    location /appsvc/ { return 403; }
    location / { return 301 https://gadu-gadu.k13.pl$request_uri; }
}

server {
    listen 443 ssl;
    server_name gadu-gadu.k13.pl;
    ssl_certificate /etc/letsencrypt/live/k13.pl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/k13.pl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /var/log/nginx/gg-retro.access.log gg_private;
    error_log /var/log/nginx/gg-retro.error.log warn;
    client_max_body_size 8k;
    client_body_timeout 10s;
    limit_conn gg_connections 8;
    limit_req_status 429;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control no-store always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'self'" always;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
    location = /appsvc/fmregister3.asp {
        limit_req zone=gg_registration burst=3 nodelay;
        proxy_pass http://10.0.1.7:18074;
    }
    location = /appsvc/regtoken.asp {
        limit_req zone=gg_web burst=5 nodelay;
        proxy_pass http://10.0.1.7:18074;
    }
    location / {
        limit_req zone=gg_web burst=20 nodelay;
        proxy_pass http://10.0.1.7:18074;
    }
}
